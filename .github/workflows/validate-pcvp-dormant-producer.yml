name: validate-pcvp-dormant-ce-producer

on:
  pull_request:
    paths:
      - "contracts/pcvp/**"
      - "contracts/CE_PCVP_DORMANT_PRODUCER_V1.md"
      - "validator/pcvp_identity.py"
      - "validator/pcvp_carrier.py"
      - "validator/_pcvp_carrier_impl.py"
      - "validator/pcvp_dormant_producer.py"
      - "validator/payload_assembler.py"
      - "scripts/validate-pcvp-canonical-bytes.py"
      - "tests/test_pcvp_dormant_producer.py"
      - ".github/workflows/validate-pcvp-dormant-producer.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Assert exact PR-head identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD_SHA"
          test -z "$(git status --porcelain)"

      - name: Checkout exact Decision Kernel canonical commit
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rezahh107/EV4-Decision-Kernel
          ref: 069a50fa243b01fa578a7c1bcb8864d9e796d34b
          path: decision-kernel
          persist-credentials: false

      - name: Assert exact Decision Kernel identity
        run: |
          set -euo pipefail
          test "$(git -C decision-kernel rev-parse HEAD)" = "069a50fa243b01fa578a7c1bcb8864d9e796d34b"
          test -z "$(git -C decision-kernel status --porcelain)"

      - name: Checkout exact Builder tolerant consumer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          repository: rezahh107/EV4-Builder-Assistant-Repo
          ref: 1a794fbd2d1df909415741a415c7a212cdde35ef
          path: builder-consumer
          persist-credentials: false

      - name: Assert exact Builder consumer identity
        run: |
          set -euo pipefail
          test "$(git -C builder-consumer rev-parse HEAD)" = "1a794fbd2d1df909415741a415c7a212cdde35ef"
          test -z "$(git -C builder-consumer status --porcelain)"
          node --version

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify exact canonical PCVP bytes
        run: |
          python scripts/validate-pcvp-canonical-bytes.py \
            --repository-root . \
            --canonical-root decision-kernel

      - name: Validate dormant producer and tolerant boundary
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
        run: |
          set -o pipefail
          pytest -p no:cacheprovider -q \
            tests/test_pcvp_dormant_producer.py \
            tests/test_pcvp_tolerant_intake.py \
            tests/test_ce_builder_producer_contract.py \
            tests/test_verified_constructability_runtime.py \
            2>&1 | tee pcvp-focused.log

      - name: Upload focused pytest evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pcvp-focused-${{ github.event.pull_request.head.sha }}
          path: pcvp-focused.log
          if-no-files-found: error
          retention-days: 7

      - name: Generate replay-derived CE carrier for Builder validation
        env:
          PYTHONPATH: "tests:."
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from deterministic_runtime_support import (
              canonical_bundle,
              canonical_draft,
              canonical_intake,
          )
          from validator.payload_assembler import canonical_bytes
          from validator.pcvp_dormant_producer import derive_continuation_assurance

          root = Path(".").resolve()
          bundle = canonical_bundle()
          intake = canonical_intake(bundle=bundle)
          carrier = derive_continuation_assurance(
              architect_intake=intake,
              architect_intake_bytes=canonical_bytes(intake),
              source_bundle=bundle,
              source_bundle_bytes=canonical_bytes(bundle),
              review_draft=canonical_draft(),
              repository_root=root,
          )
          Path("builder-consumer/ce-pcvp-carrier.json").write_text(
              json.dumps({"continuation_assurance": carrier}, sort_keys=True),
              encoding="utf-8",
          )
          PY

      - name: Validate through exact Builder tolerant consumer
        working-directory: builder-consumer
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { inspectOptionalPcvpCarrier } from './scripts/lib/pcvp-carrier.mjs';

          const document = JSON.parse(readFileSync('ce-pcvp-carrier.json', 'utf8'));
          const result = inspectOptionalPcvpCarrier(document, {
            expectedSourceStages: ['CONSTRUCTABILITY_ENGINEER']
          });
          if (result.status !== 'validated') {
            throw new Error(JSON.stringify(result.diagnostics));
          }
          if (JSON.stringify(result.carrier) !== JSON.stringify(document)) {
            throw new Error('Builder tolerant consumer did not preserve the carrier losslessly.');
          }
          console.log(`BUILDER_PCVP_VALIDATED ${result.canonical_sha256}`);
          NODE

      - name: Compile changed Python surfaces and inspect patch whitespace
        run: |
          git diff --check HEAD^ HEAD
          python -m py_compile \
            validator/pcvp_identity.py \
            validator/pcvp_carrier.py \
            validator/_pcvp_carrier_impl.py \
            validator/pcvp_dormant_producer.py \
            validator/payload_assembler.py \
            scripts/validate-pcvp-canonical-bytes.py \
            tests/test_pcvp_dormant_producer.py
