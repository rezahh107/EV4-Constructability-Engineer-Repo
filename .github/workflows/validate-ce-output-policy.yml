name: validate-ce-output-policy

on:
  pull_request:
    paths:
      - 'validator/ce_validation_transaction.py'
      - 'validator/_verified_project_gate_exporter_impl.py'
      - 'validator/project_gate_exporter.py'
      - 'tests/test_ce_output_policy.py'
      - 'tests/test_project_gate_exporter.py'
      - 'tests/test_ce_external_output_boundary.py'
      - 'docs/CE_OUTPUT_PATH_POLICY.md'
      - '.github/workflows/validate-ce-output-policy.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Assert exact PR-head identity
        env:
          EXPECTED_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          TESTED_SHA="$(git rev-parse HEAD)"
          test "$TESTED_SHA" = "$EXPECTED_HEAD_SHA"
          printf 'tested_pr_head=%s\n' "$TESTED_SHA"

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Install supported development dependencies
        run: python -m pip install -e '.[dev]'

      - name: Verify caller-specific output policy
        run: |
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 pytest -q \
            tests/test_ce_output_policy.py \
            tests/test_project_gate_exporter.py \
            tests/test_ce_external_output_boundary.py

      - name: Run required repository validation
        run: |
          set -euo pipefail
          python -m compileall -q validator tests
          pytest -q
          python scripts/validate-behavioral-rule-coverage.py
          python scripts/validate-role-alignment-fixtures.py
          npm run test:reference-paradigm-lock
          git diff --check
